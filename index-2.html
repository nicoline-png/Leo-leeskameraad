<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo je leeskameraad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF0F5; --panel:#FFFFFF; --panel2:#F6F8FB; --ink:#17202E; --muted:#556072; --line:#D3DAE4;
  --good:#17824A; --good-bg:#E3F6EA; --bad:#7A4FD0; --bad-bg:#F1EBFD; --focus:#1E5EFF;
  --acc:#2F5BD3; --acc-ink:#FFFFFF; --acc-soft:#E3EAFB;
  --mark-ink:#1A1A1A;
  --r-tijd:#BFDFFF; --r-opsom:#D4F2A8; --r-tegen:#FFC2C2; --r-vergel:#E3D2FF; --r-oorzaak:#FFD3A3;
  --r-doel:#B6EEE8; --r-voorw:#FFF08F; --r-reden:#F8CBE8; --r-voorb:#D9DEE6; --r-concl:#9EEBC9;
  --shadow:0 1px 0 rgba(23,32,46,.06), 0 6px 18px -10px rgba(23,32,46,.25);
  --fs:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --panel:#1B2230; --panel2:#222B3B; --ink:#EAF0F8; --muted:#A5B0C2; --line:#344055;
    --good:#5BD18E; --good-bg:#15321F; --bad:#C3A6FF; --bad-bg:#2B2340; --focus:#8FB0FF;
    --acc-soft:#26314A; color-scheme:dark;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --panel:#1B2230; --panel2:#222B3B; --ink:#EAF0F8; --muted:#A5B0C2; --line:#344055;
  --good:#5BD18E; --good-bg:#15321F; --bad:#C3A6FF; --bad-bg:#2B2340; --focus:#8FB0FF;
  --acc-soft:#26314A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:var(--fs);line-height:1.55;min-height:100%;-webkit-font-smoothing:antialiased}
html.big{--fs:21px}
[data-lang="nl"]{--acc:#E4670F;--acc-ink:#FFFFFF}
[data-lang="en"]{--acc:#2F5BD3;--acc-ink:#FFFFFF}
[data-lang="de"]{--acc:#B98900;--acc-ink:#FFFFFF}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) [data-lang="nl"]{--acc:#FF8A3D;--acc-ink:#1A1206} :root:not([data-theme="light"]) [data-lang="en"]{--acc:#7C9BFF;--acc-ink:#0D1530} :root:not([data-theme="light"]) [data-lang="de"]{--acc:#F2C230;--acc-ink:#1E1600} }
h1,h2,h3,.ui{font-family:Lexend,"Segoe UI",system-ui,sans-serif}
h1{font-size:clamp(2rem,5.5vw,3.1rem);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0 0 .6rem}
h2{font-size:1.45rem;line-height:1.25;font-weight:600;margin:0 0 .5rem}
h3{font-size:1.1rem;line-height:1.3;font-weight:600;margin:0 0 .35rem}
p{margin:0 0 .8rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:860px;margin:0 auto;padding:1rem 1.1rem 4rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* highlighter */
.mk{background:linear-gradient(transparent 12%,var(--mkc,var(--acc-soft)) 12%,var(--mkc,var(--acc-soft)) 88%,transparent 88%);color:inherit;padding:0 .14em;border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mk.col{color:var(--mark-ink)}
[data-rel="tijd"]{--mkc:var(--r-tijd)}[data-rel="opsom"]{--mkc:var(--r-opsom)}[data-rel="tegen"]{--mkc:var(--r-tegen)}[data-rel="vergel"]{--mkc:var(--r-vergel)}[data-rel="oorzaak"]{--mkc:var(--r-oorzaak)}[data-rel="doel"]{--mkc:var(--r-doel)}[data-rel="voorw"]{--mkc:var(--r-voorw)}[data-rel="reden"]{--mkc:var(--r-reden)}[data-rel="voorb"]{--mkc:var(--r-voorb)}[data-rel="concl"]{--mkc:var(--r-concl)}
.sw{border-radius:.2em}
.show-sw .sw{background:linear-gradient(transparent 12%,var(--mkc,#eee) 12%,var(--mkc,#eee) 88%,transparent 88%);color:var(--mark-ink);padding:0 .12em;font-weight:700}
.swatch{display:inline-block;width:.8em;height:.8em;border-radius:3px;background:var(--mkc);vertical-align:-.05em;margin-right:.35em;border:1px solid rgba(0,0,0,.12)}

/* home */
.home{max-width:980px;margin:0 auto;padding:clamp(1.5rem,6vw,4rem) 1.2rem 4rem}
.brand{font-family:Lexend,system-ui,sans-serif;font-weight:600;font-size:1rem;display:flex;align-items:center;gap:.5rem;margin-bottom:2.2rem;color:var(--muted)}
.brand b{color:var(--ink)}
.home .lede{font-size:1.15rem;color:var(--muted);max-width:40ch;margin-bottom:2rem}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media (max-width:720px){.langs{grid-template-columns:1fr}}
.lang{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.9rem;padding:1.4rem 1.3rem 1.2rem;background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;min-height:190px}
.lang:hover{border-color:var(--acc);transform:translateY(-2px)}
.lang .nm{font-family:Lexend,system-ui,sans-serif;font-size:1.6rem;font-weight:700;display:flex;align-items:center;gap:.6rem}
.lang .dot{width:14px;height:14px;border-radius:50%;background:var(--acc)}
.lang .ex{font-size:1.08rem;line-height:1.5}
.lang .ex .mk{--mkc:var(--acc);color:var(--acc-ink);animation:swipe .9s .35s both cubic-bezier(.3,.7,.2,1)}
.lang .st{margin-top:auto;font-size:.92rem;color:var(--muted)}
.lang .st strong{color:var(--bad)}
@keyframes swipe{from{background-size:0% 100%;color:var(--ink)}to{background-size:100% 100%;color:var(--acc-ink)}}
.lang .ex .mk{background-repeat:no-repeat}
@media (prefers-reduced-motion:reduce){.lang .ex .mk{animation:none}.lang{transition:none}}

/* app header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:.6rem 1.1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.45rem;border:2px solid var(--acc);background:var(--panel);border-radius:999px;padding:.3rem .8rem .3rem .6rem;font-family:Lexend,system-ui,sans-serif;font-weight:600;font-size:.95rem}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--acc)}
.chip small{font-weight:400;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.35rem .65rem;font-family:Lexend,system-ui,sans-serif;font-size:.9rem}
.tabs{max-width:860px;margin:0 auto;padding:0 1.1rem;display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:.7rem .9rem .75rem;font-family:Lexend,system-ui,sans-serif;font-size:1rem;font-weight:500;color:var(--muted);border-bottom:4px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:.75rem;padding:.05rem .45rem;font-weight:600;min-width:1.4em;text-align:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#2a0a12}}

/* generic blocks */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.25rem;box-shadow:var(--shadow)}
.stack>*+*{margin-top:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:12px;padding:.8rem 1.25rem;font-family:Lexend,system-ui,sans-serif;font-weight:600;font-size:1rem;background:var(--acc);color:var(--acc-ink);min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.soft{background:var(--acc-soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1rem}
.seg button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:.4rem .9rem;font-family:Lexend,system-ui,sans-serif;font-size:.93rem;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:var(--acc-ink)}
.intro{font-size:1.05rem;color:var(--muted);max-width:60ch;margin-bottom:1.2rem}

/* tips */
.tipcard{position:relative;padding:1.5rem 1.4rem 1.3rem}
.tipnum{font-family:Lexend,system-ui,sans-serif;font-weight:700;font-size:2.6rem;line-height:1;color:var(--acc);margin-bottom:.4rem}
.tipcard ul{margin:.3rem 0 .6rem;padding-left:1.15rem}
.tipcard li{margin:.3rem 0}
.tipnav{display:flex;align-items:center;gap:.6rem;margin-top:1rem}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.note{background:var(--panel2);border-left:4px solid var(--acc);border-radius:8px;padding:.6rem .8rem;margin-top:.6rem;font-size:.97rem}
.tipall .tipcard{margin-bottom:1rem}

/* practice path */
.path{display:grid;gap:.8rem}
.stepc{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:1.1rem 1.2rem}
.stepc .n{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:Lexend,system-ui,sans-serif;font-weight:700;font-size:1.3rem;background:var(--acc-soft);color:var(--ink)}
.stepc.rec{border:2px solid var(--acc)}
.stepc.rec .n{background:var(--acc);color:var(--acc-ink)}
.stars{font-size:1.05rem;letter-spacing:.1em;color:var(--muted)}
.stars b{color:#E0A100}
.pill{display:inline-block;font-family:Lexend,system-ui,sans-serif;font-size:.78rem;font-weight:600;border-radius:999px;padding:.12rem .55rem;background:var(--acc);color:var(--acc-ink);margin-left:.4rem;vertical-align:.12em}
.pill.grey{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
@media (max-width:560px){.stepc{grid-template-columns:auto 1fr}.stepc .btn{grid-column:1/-1}}
details.cheat{margin-top:1.3rem}
details.cheat summary{cursor:pointer;font-family:Lexend,system-ui,sans-serif;font-weight:600;padding:.9rem 1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.cheat summary::-webkit-details-marker{display:none}
details.cheat summary::after{content:"+";font-size:1.4rem;color:var(--muted)}
details.cheat[open] summary::after{content:"–"}
.cheat-body{padding:0 1.1rem 1.1rem}
.relrow{padding:.7rem 0;border-top:1px solid var(--line)}
.relrow h3{margin:0}
.relrow p{margin:.15rem 0 .35rem;color:var(--muted);font-size:.95rem}
.wl{display:flex;flex-wrap:wrap;gap:.35rem .5rem}
.wl span{font-size:.98rem}
.wl em{font-style:normal;color:var(--muted);font-size:.85em}

/* quiz */
.qtop{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.prog i.ok{background:var(--good)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--acc)}
.qcount{font-family:Lexend,system-ui,sans-serif;font-size:.9rem;color:var(--muted);white-space:nowrap}
.qask{font-family:Lexend,system-ui,sans-serif;font-size:1.2rem;font-weight:600;line-height:1.35;margin:0 0 1rem}
.bigword{font-family:Lexend,system-ui,sans-serif;font-size:clamp(2rem,7vw,3rem);font-weight:700;text-align:center;padding:1.6rem 1rem 1.3rem}
.bigword .mk{padding:0 .25em}
.bigword .tr{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:1rem;font-weight:400;color:var(--muted);margin-top:.5rem}
.sent{font-size:1.25rem;line-height:1.65;padding:1.3rem 1.2rem}
.gap{display:inline-block;min-width:5.5em;border-bottom:3px dashed var(--acc);text-align:center;margin:0 .15em;line-height:1.2}
.gap.filled{border-bottom-style:solid;font-weight:700}
.opts{display:grid;gap:.6rem;margin-top:1rem}
.opt{display:flex;align-items:flex-start;gap:.8rem;text-align:left;width:100%;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:.85rem 1rem;min-height:56px;font-size:1.02rem;line-height:1.4;transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{flex:none;width:1.9em;height:1.9em;border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-family:Lexend,system-ui,sans-serif;font-size:.85rem;font-weight:600;color:var(--muted);margin-top:-.05em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.fb{margin-top:1rem;border-radius:14px;padding:1rem 1.1rem;border:2px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{display:flex;align-items:center;gap:.5rem}
.fb .lbl{font-family:Lexend,system-ui,sans-serif;font-weight:600;font-size:.9rem;margin-top:.6rem;color:var(--muted)}
.fb p{margin:.15rem 0 .4rem}
.fb .tipline{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed currentColor;border-color:var(--line);font-size:.96rem}
.qfoot{display:flex;gap:.6rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.hint{margin-top:.8rem;background:var(--panel2);border-radius:12px;padding:.8rem 1rem;font-size:.97rem;border:1px dashed var(--line)}
.retry-tag{display:inline-block;font-family:Lexend,system-ui,sans-serif;font-size:.8rem;font-weight:600;background:var(--acc-soft);border-radius:999px;padding:.15rem .6rem;margin-bottom:.6rem}

/* text */
.text{padding:1.2rem 1.25rem}
.text h3{font-size:1.25rem;margin-bottom:.8rem}
.ts{display:block;width:100%;text-align:left;border:2px solid transparent;background:none;border-radius:10px;padding:.35rem .5rem .35rem 2.3rem;position:relative;font-size:1.05rem;line-height:1.6;margin:.1rem 0;cursor:default}
.ts .zn{position:absolute;left:.45rem;top:.45rem;font-family:Lexend,system-ui,sans-serif;font-size:.72rem;font-weight:600;color:var(--muted);background:var(--panel2);border-radius:6px;padding:.05rem .35rem}
.text.pick .ts{cursor:pointer;border-color:var(--line);border-style:dashed}
.text.pick .ts:hover{border-color:var(--acc);border-style:solid}
.ts.right{border-color:var(--good)!important;border-style:solid!important;background:var(--good-bg)}
.ts.wrong{border-color:var(--bad)!important;border-style:solid!important;background:var(--bad-bg)}
.ts.focus{background:var(--acc-soft)}
.textq{margin-top:1rem}
.toggle{display:inline-flex;align-items:center;gap:.5rem;font-size:.95rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.35rem .8rem}
.toggle[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.85rem;color:var(--muted);margin-top:.7rem}

/* list of texts */
.tlist{display:grid;gap:.8rem}
.titem{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;padding:1.1rem 1.2rem}
.titem h3{margin:0 0 .15rem}

/* result */
.result{text-align:center;padding:2rem 1.2rem}
.result .score{font-family:Lexend,system-ui,sans-serif;font-size:3.2rem;font-weight:700;line-height:1}
.result .stars{font-size:1.8rem;margin:.6rem 0 1rem}
.result .row{justify-content:center;margin-top:1.2rem}
.result ul{text-align:left;max-width:520px;margin:.8rem auto 0;padding-left:1.1rem}
.pause{margin:1.2rem auto 0;max-width:460px;font-size:.97rem}

/* fouten */
.bars{display:grid;gap:.55rem;margin-top:.6rem}
.bar{display:grid;grid-template-columns:minmax(9rem,13rem) 1fr auto;gap:.7rem;align-items:center;font-size:.97rem}
.bar .track{height:14px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--mkc);border-right:2px solid rgba(0,0,0,.2)}
.bar .cnt{font-family:Lexend,system-ui,sans-serif;font-size:.85rem;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.bar{grid-template-columns:1fr auto}.bar .track{grid-column:1/-1;order:3}}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem;margin-top:.6rem}
.trap{border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem;background:var(--panel2)}
.trap b{font-family:Lexend,system-ui,sans-serif}
.trap .x{float:right;font-family:Lexend,system-ui,sans-serif;font-weight:700;color:var(--bad)}
.trap p{margin:.3rem 0 0;font-size:.92rem;color:var(--muted)}
.wlist{list-style:none;margin:.6rem 0 0;padding:0}
.wlist li{padding:.6rem 0;border-top:1px solid var(--line);font-size:.97rem}
.wlist li small{color:var(--muted)}
.empty{text-align:center;padding:2rem 1rem}
.callout{border:2px solid var(--acc);border-radius:14px;padding:1rem 1.1rem;background:var(--acc-soft)}
.danger{color:var(--bad);border-color:var(--bad)!important}

/* pennen */
:root{--pen-red:#D0342C;--pen-blue:#1F5FBF;--pen-yel:#D99A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pen-red:#FF7A72;--pen-blue:#86B4FF;--pen-yel:#F2C230}}
:root[data-theme="dark"]{--pen-red:#FF7A72;--pen-blue:#86B4FF;--pen-yel:#F2C230}
.wrap.wide{max-width:860px}
@media (min-width:980px){
  .wrap.wide{max-width:1200px}
  .techgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.4rem;align-items:start}
  .tcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 1rem);max-height:calc(100vh - 2rem);overflow:auto;border-radius:16px}
}
@media (max-width:979px){.qcol{margin-top:1rem}}
.tx h3{font-size:1.25rem;margin-bottom:.7rem}
.tx .para{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.55rem;padding:.45rem .2rem;border-radius:10px}
.tx:not(.multi) .para{grid-template-columns:minmax(0,1fr)}
.tx:not(.multi) .kl{display:none}
.kl{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding-top:.25rem}
.an{font-family:Lexend,system-ui,sans-serif;font-size:.8rem;font-weight:600;color:var(--muted)}
.pb{position:relative;font-size:1.05rem;line-height:1.8}
.tsi{border-radius:6px;padding:.05rem .1rem;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tsi.pickable{cursor:pointer;text-decoration:underline dashed var(--muted);text-decoration-thickness:1px;text-underline-offset:5px}
.tsi.pickable:hover,.tsi.pickable:focus-visible{background:var(--acc-soft);text-decoration:underline solid var(--acc);text-decoration-thickness:3px}
.tsi.right{background:var(--good-bg);text-decoration:underline solid var(--good);text-decoration-thickness:3px;text-underline-offset:5px}
.tsi.wrong{background:var(--bad-bg);text-decoration:underline solid var(--bad);text-decoration-thickness:3px;text-underline-offset:5px}
.tsi.focus{background:var(--acc-soft)}
sup.zn{font-family:Lexend,system-ui,sans-serif;font-size:.65rem;font-weight:600;color:var(--muted);margin-right:.15rem}
.show-circ .sw,.circ{border:2px solid var(--pen-red);border-radius:999px;padding:0 .22em}
.show-sw.show-circ .sw{padding:0 .22em}
.circ.miss{border-style:dashed;border-color:var(--bad);background:var(--bad-bg)}
.fp{text-decoration:line-through;text-decoration-color:var(--muted);text-decoration-thickness:2px;opacity:.75}
.tok{background:none;padding:0 .12em;margin:0;font:inherit;line-height:inherit;color:inherit;border:2px solid transparent;border-radius:999px;cursor:pointer}
.tok:hover{border-color:var(--line)}

/* Teksten op examenniveau. Alinea's = arrays met [zin, rol]. */
function T(id,lvl,title,paras,qs,tech){
  const s=[]; const start=[];
  paras.forEach((pa,pi)=>{start[pi]=s.length; pa.forEach(([t,r,w])=>s.push({t,r,w,p:pi}))});
  const gi=(p,k)=>start[p]+k;
  const q=qs.map(x=>{const y={...x}; if(y.type==="kern"){y.ans=gi(y.p,y.k); y.pp=y.p} if(y.type==="rel"){y.si=gi(y.p,y.k)} return y});
  return {id,lvl,title,s,q,tech,np:paras.length};
}

const KEY="leo-v2";
function blank(){return {lang:null,size:0,p:{},seenTips:{},updatedAt:0}}
let S=(()=>{try{const j=JSON.parse(localStorage.getItem(KEY)||"null");return j&&typeof j==="object"?Object.assign(blank(),j):blank()}catch(e){return blank()}})();
let dbRef=null, saveTimer=null, chain=Promise.resolve();
function P(l){l=l||S.lang; if(!S.p[l])S.p[l]={rel:{},traps:{},wrong:{},best:{}}; if(!S.p[l].stats)S.p[l].stats={ok:0,all:0}; return S.p[l]}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(!dbRef)return; const body={state:JSON.stringify(S),updatedAt:S.updatedAt}; chain=chain.then(()=>dbRef.set(body)).catch(()=>{}); },900);
}
(async function connect(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.doc("data/users/"+id+"/progress-v2");
    const snap=await ref.get();
    if(snap.exists){
      const d=snap.data()||{}; let remote=null; try{remote=JSON.parse(d.state||"null")}catch(e){}
      if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){ S=Object.assign(blank(),remote); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(!V.round)render(); }
    }
    dbRef=ref; if(S.updatedAt)save();
  }catch(e){}
})();

/* ============================================================
   HULPFUNCTIES
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function marks(str,filled){return esc(str).replace(/\[\[([^\]|]+)(?:\|(\w*))?\]\]/g,(m,w,r)=>`<span class="sw" data-rel="${r||""}">${w}</span>`).replace(/\{\{([^}|]+)\|([+-])\}\}/g,(m,w,t)=>`<span class="tone" data-t="${t==="+"?"p":"m"}">${w}</span>`).replace(/%%(\d+)%%/g,(m,g)=>gapHtml(g,filled))}
const plain=str=>str.replace(/\[\[([^\]|]+)(?:\|\w*)?\]\]/g,"$1").replace(/\{\{([^}|]+)\|[+-]\}\}/g,"$1").replace(/%%(\d+)%%/g,"…($1)…");
function relTag(r){return `<span data-rel="${r}"><span class="swatch"></span></span>${REL[r].n}`}
function basisOf(r,n){return shuffle(BASIS[S.lang][r]).slice(0,n).map(w=>w[0]).join(", ")}
function wordsOf(l,r,n){return shuffle(WORDS[l][r]).slice(0,n).map(w=>w[0]).join(", ")}
function distractors(r,n,pool){const ex=[r,...(EXCL[r]||[])];return shuffle((pool||RK).filter(k=>!ex.includes(k))).slice(0,n)}
function openCount(l){return Object.values(P(l).wrong).filter(w=>!w.fixed).length}
function starStr(best,max){if(best==null)return `<span class="stars">☆☆☆</span>`;const r=best/max;const n=r>=.99?3:r>=.6?2:r>0?1:0;return `<span class="stars" aria-label="${n} van 3 sterren"><b>${"★".repeat(n)}</b>${"☆".repeat(3-n)}</span>`}

/* Talen die tijdelijk verborgen zijn. Weer zichtbaar maken: haal de taal uit deze lijst. */
const HIDDEN_LANGS=["nl"];
function render(){
  if(S.lang&&HIDDEN_LANGS.includes(S.lang)){S.lang=null;V.round=null;V.tech=null}
  document.documentElement.classList.toggle("big",S.size===1);
  const app=$("#app");
  if(!S.lang){app.removeAttribute("data-lang");app.innerHTML=homeView();return}
  app.setAttribute("data-lang",S.lang);
  const tc=document.querySelector(".tcol"), tcs=tc?tc.scrollTop:0;
  if(V.tech){app.innerHTML=techView();const n=document.querySelector(".tcol");if(n)n.scrollTop=tcs;return}
  if(V.round){app.innerHTML=roundView();const n=document.querySelector(".tcol");if(n)n.scrollTop=tcs;return}
  if(!S.introSeen){V.intro=true;S.introSeen=1;save()}
  app.innerHTML=headerView()+`<main class="wrap" id="main">${tabView()}</main>`+(V.intro?introView():"");
  if(V.intro){const b=document.getElementById("introgo");if(b)b.focus({preventScroll:true})}
}

function homeView(){
  const tiles=Object.entries(LANGS).filter(([k])=>!HIDDEN_LANGS.includes(k)).map(([k,L])=>{

function qkind(q){
  if(q.type!=="mc")return q.type;

function itemFromKey(key){
  const l=S.lang, parts=key.split("|");
  if(parts[0]==="w"){const r=parts[1];const w=allWords(l,r).find(x=>x[0]===parts[2]);return w?mkWord(r,w):null}
  if(parts[0]==="wb"){const r=parts[1];const w=allWords(l,r).find(x=>x[0]===parts[2]);return w?mkWord(r,w,BASIS_RK):null}
  if(parts[0]==="rijb")return BASIS_RK.includes(parts[1])?mkRij(parts[1],BASIS_RK):null;
  if(parts[0]==="strat")return mkStrat(+parts[1]);
  if(parts[0]==="rij")return RK.includes(parts[1])?mkRij(parts[1]):null;
  if(parts[0]==="kies")return RK.includes(parts[1])?mkKies(parts[1]):null;
  if(parts[0]==="vind"||parts[0]==="vind2")return vindFromKey(key);
  if(parts[0]==="s2"){const i=+parts[1];return FILL[l][i]?mkFill(i):null}
  if(parts[0]==="s3"){const i=+parts[1];return NEXT[l][i]?mkNext(i):null}
  if(parts[0]==="t"){const t=TEXTS[l].find(x=>x.id===parts[1]);const qi=+parts[2];return t&&t.q[qi]?mkTQ(t,qi):null}
  return null;
}
function mkWord(r,w,pool){
  const opts=shuffle([r,...distractors(r,3,pool)]).map(k=>({html:relTag(k),label:REL[k].n,ok:k===r,rel:k,
    why:k===r?"":`${REL[k].n}? Dan verwacht je woorden als <i>${esc(pool?basisOf(k,3):wordsOf(S.lang,k,3))}</i>. ‘${esc(w[0])}’ hoort daar niet bij.`}));
  return {k:"w",key:`${pool?"wb":"w"}|${r}|${w[0]}`,rel:r,word:w[0],tr:w[1],note:w[2],opts,
    okWhy:`‘${esc(w[0])}’${w[1]?` (= ${esc(w[1])})`:""} hoort bij <b>${REL[r].n}</b>. ${REL[r].d}`,
    label:`‘${esc(w[0])}’ hoort bij ${REL[r].n}`,
    hint:`Bedenk een zin met ‘${esc(w[0])}’ erin. Wat doet het woord: geeft het een reden, een tegenstelling, een voorbeeld…?`};
}
function mkFill(i){
  const it=FILL[S.lang][i]; const cr=it.o[0][1];
  const opts=shuffle(it.o.map((o,j)=>({html:esc(o[0]),label:o[0],ok:j===0,rel:o[1],
    why:j===0?"":`‘${esc(o[0])}’ is een woord voor ${REL[o[1]].n.toLowerCase()}. Dat past hier niet.`})));
  return {k:"s2",key:`s2|${i}`,rel:cr,s:it.s,ans:it.o[0][0],opts,okWhy:`‘${esc(it.o[0][0])}’ geeft <b>${REL[cr].n}</b> aan. ${esc(it.why)}`,
    label:`Zin: “${esc(it.s.replace("___","…"))}” → ‘${esc(it.o[0][0])}’`,
    hint:`Lees de zin zonder gat. Wat is het verband tussen het eerste en het tweede deel? Zoek dan het woord dat bij dat verband hoort.`};
}
function mkNext(i){
  const it=NEXT[S.lang][i];
  const opts=shuffle(it.o.map((o,j)=>({html:esc(o.t),label:o.t,ok:j===0,why:o.why})));
  return {k:"s3",key:`s3|${i}`,rel:it.rel,s:it.s,opts,okWhy:it.o[0].why,
    label:`${marks(it.s).replace(/<[^>]+>/g,"")} → ${esc(it.o[0].t)}`,
    hint:`Kijk naar het gekleurde signaalwoord. ${REL[it.rel].n}: ${REL[it.rel].d}`};
}
function mkTQ(t,qi){
  const q=t.q[qi]; const base={k:"tq",key:`t|${t.id}|${qi}`,text:t,q,hint:q.hint};
  if(q.type==="kern"){
    const multi=t.np>1, cut=x=>{x=plain(x);return x.length>70?x.slice(0,68)+"…":x};
    return {...base,trapOnWrong:"kernzin",opts:t.s.map((s,j)=>({label:multi?`‘${cut(s.t)}’`:`zin ${j+1}`,ok:j===q.ans,why:s.w||ROLE[s.r]||""})),
      rightText:multi?`‘${esc(cut(t.s[q.ans].t))}’`:`Zin ${q.ans+1}`,
      okWhy:multi?`Dit is de kernzin van alinea ${q.pp+1}: de rest van de alinea legt hem uit of ondersteunt hem.`:`Zin ${q.ans+1} is de kernzin: de rest van de alinea legt hem uit of ondersteunt hem.`,label:`Kernzin zoeken <small>(${esc(t.title)})</small>`};
  }
  if(q.type==="rel"){
    const r=q.ans;
    const opts=shuffle([r,...distractors(r,3)]).map(k=>({html:relTag(k),label:REL[k].n,ok:k===r,why:k===r?"":`${REL[k].n} past niet. ${REL[r].n}: ${REL[r].d}`}));
    return {...base,rel:r,opts,focus:q.si,okWhy:`‘${esc(q.word)}’ geeft <b>${REL[r].n}</b> aan. ${REL[r].d}`,label:`Verband bij ‘${esc(q.word)}’ <small>(${esc(t.title)})</small>`};
  }
  if(q.type==="tf"){
    const opts=[{html:"Juist",label:"Juist",ok:q.ans===true},{html:"Onjuist",label:"Onjuist",ok:q.ans===false}].map(o=>({...o,why:o.ok?"":esc(q.why),trap:o.ok?null:q.trap}));
    return {...base,opts,okWhy:esc(q.why),label:`Juist of onjuist: “${esc(q.claim)}” <small>(${esc(t.title)})</small>`};
  }
  const opts=shuffle(q.o.map(o=>({html:esc(o.t),label:o.t,ok:!!o.ok,why:esc(o.why),trap:o.trap||null})));
  return {...base,opts,okWhy:esc(q.o.find(o=>o.ok).why),label:`${esc(q.q)} <small>(${esc(t.title)})</small>`};
}

function startRound(v,annot){
  const l=S.lang; let items=[], title="", mode=v, text=null;
  if(v==="sw1"){title="Herken het verband";const rels=shuffle(RK).slice(0,5);items=rels.map(r=>mkWord(r,pick(WORDS[l][r])))}
  else if(v==="sw2"){title="Kies het juiste woord";items=shuffle(FILL[l].map((_,i)=>i)).slice(0,5).map(mkFill)}
  else if(v==="sw3"){title="Wat komt erna?";items=shuffle(NEXT[l].map((_,i)=>i)).slice(0,5).map(mkNext)}
  else if(v==="b-rij"){title="Start: reeksen herkennen";items=shuffle(BASIS_RK).map(r=>mkRij(r,BASIS_RK))}
  else if(v==="b-w"){title="Start: welk verband?";items=shuffle(BASIS_RK).map(r=>mkWord(r,pick(BASIS[l][r]),BASIS_RK))}
  else if(v==="b-vind"){title="Start: vind het signaalwoord";items=shuffle(vindBank(l).filter(e=>e.src==="e")).slice(0,5).map(e=>mkVind(e,false))}
  else if(v==="rij"){title="Reeksen herkennen";items=shuffle(RK).slice(0,5).map(r=>mkRij(r))}
  else if(v==="kies"){title="Welke woorden horen erbij?";items=shuffle(RK).slice(0,5).map(mkKies)}
  else if(v==="vind"||v==="vind2"){title=v==="vind"?"Vind het signaalwoord":"Vind het en benoem het verband";items=shuffle(vindBank(l)).slice(0,v==="vind"?5:6).map(e=>mkVind(e,v==="vind2"))}
  else if(v.startsWith("rel:")){const r=v.slice(4);title="Oefenen: "+REL[r].n;

function tokenize(str){
  const re=/\[\[[^\]]+\]\]|\{\{[^}]+\}\}|%%\d+%%|(?:(?!\[\[|\{\{|%%)\S)+/g; const out=[]; let m;
  while((m=re.exec(str))){
    const raw=m[0], sp=m.index>0&&/\s/.test(str[m.index-1]);
    let tok={raw,sp,kind:"w",text:raw};
    if(raw.startsWith("[[")){const [w,r]=raw.slice(2,-2).split("|");tok={raw,sp,kind:"sw",text:w,rel:r||""}}
    else if(raw.startsWith("{{")){const [w,t]=raw.slice(2,-2).split("|");tok={raw,sp,kind:"tone",text:w,t}}
    else if(raw.startsWith("%%")){tok={raw,sp,kind:"gap",text:raw.slice(2,-2)}}
    out.push(tok);
  }
  return out;
}

function techCheck(){
  const X=V.tech, t=X.t, st=X.steps[X.step].k, p=P();
  if(st==="circle"){
    const targets=targetsOf(t); const tids=new Set(targets.map(x=>x.id));
    const sig=sigSet(S.lang); const extraSel=[...X.sel].filter(id=>!tids.has(id)).map(id=>{const [si,ti]=id.split("-").map(Number);return tokenize(t.s[si].t)[ti].text});
    const fp=extraSel.filter(w=>!sig.has(clean(w))), extra=extraSel.filter(w=>sig.has(clean(w)));
    const found=targets.filter(x=>X.sel.has(x.id)).length;
    X.circleRes={targets,fp,extra};
    X.ok.circle=found/targets.length>=.75&&fp.length<=2;
    targets.forEach(x=>{if(!x.rel)return;p.rel[x.rel]=p.rel[x.rel]||{ok:0,bad:0};X.sel.has(x.id)?p.rel[x.rel].ok++:p.rel[x.rel].bad++});
    const miss=targets.length-found; if(miss)p.traps["sw-gemist"]=(p.traps["sw-gemist"]||0)+miss;
    save();
  }
  if(st==="tone"){
    X.toneRes=t.tech.tone.map((v,i)=>X.tone[i]===v);
    const bad=X.toneRes.filter(x=>!x).length; X.ok.tone=bad===0; if(bad)techRecordTrap("toon",bad);
  }
  if(st==="strike"){
    const q=t.q[t.tech.strike]; const left=q.o.findIndex((o,i)=>!X.strike[i]); const idOk=left>=0&&!!q.o[left].ok;
    X.strikeRes={}; X.ok.strike=idOk;
    const it=mkTQ(t,t.tech.strike); const opt=it.opts.find(x=>x.label===(q.o[left]||{}).t)||{label:"(geen)",trap:null};
    record(it,idOk,opt); if(!idOk)techRecordTrap("wegstrepen");
  }
  render();
}

const clean=w=>w.toLowerCase().replace(/[.,;:!?“”„"‘’'()…]/g,"");
const TRICKY={nl:["na","dan","toen","zo","alleen","daarom","dus","als"],en:["then","so","when","while","only","even","after","and","as"],de:["nach","dann","so","nur","wenn","als","also","doch"]};
function sigSet(l,strict){const set=new Set(["en","and","und",...(strict?TRICKY[l]:[])]);RK.forEach(r=>[...WORDS[l][r],...((WX[l]&&WX[l][r])||[])].forEach(w=>{if(!/\s|…/.test(w[0]))set.add(clean(w[0]))}));return set}

function vindBank(l){
  const set=sigSet(l,true), out=[];
  const ok1=str=>{const toks=tokenize(str);const tg=toks.filter(k=>k.kind==="sw");if(tg.length!==1||!tg[0].rel)return false;return !toks.some(k=>k.kind!=="sw"&&set.has(clean(k.text)))};
  EASY[l].forEach((s,i)=>{if(ok1(s))out.push({src:"e",i,str:s})});
  SENT[l].forEach((s,i)=>{if(ok1(s))out.push({src:"s",i,str:s})});
  TEXTS[l].forEach(t=>t.s.forEach((s,i)=>{if(ok1(s.t))out.push({src:t.id,i,str:s.t})}));
  return out;
}
function mkRij(r,pool){
  const words=shuffle((pool?BASIS:WORDS)[S.lang][r]).slice(0,4).map(w=>w[0]);
  const opts=shuffle([r,...distractors(r,3,pool)]).map(k=>({html:relTag(k),label:REL[k].n,ok:k===r,rel:k,
    why:k===r?"":`${REL[k].n}? Dan verwacht je woorden als <i>${esc(pool?basisOf(k,3):wordsOf(S.lang,k,3))}</i>.`}));
  return {k:"rij",key:`${pool?"rijb":"rij"}|${r}`,rel:r,words,opts,okWhy:`Deze reeks hoort bij <b>${REL[r].n}</b>. ${REL[r].d}`,
    label:`Reeks ‘${esc(words.join(", "))}’ hoort bij ${REL[r].n}`,hint:`Kies één woord uit de reeks en maak er een zin mee. Wat doet het woord in jouw zin?`};

    body=`<p class="qask">Welk woord past op de open plek?</p><div class="panel sent">${esc(parts[0])}${fill}${esc(parts[1]||"")}</div>${optsView(it)}`;
  } else if(it.k==="s3"){
    body=`<p class="qask">Wat komt er na het signaalwoord?</p><div class="panel sent show-sw">${marks(it.s)}</div>${optsView(it)}`;
  } else if(it.k==="tq"){ body=textQView(it); }
  else if(it.k==="strat"){body=`<div class="bonus">⚡ Bonus: techniek-check <span class="xp">+15 XP</span></div><p class="qask">${esc(it.q)}</p>${optsView(it)}`}
  else if(it.k==="rij"){body=rijView(it)}
  else if(it.k==="kies"){body=kiesView(it)}
  else if(it.k==="vind"){body=vindView(it)}
  const TQ=it.k==="tq";
  const tipBtn=!A&&it.hint&&!(TQ&&it.phases&&!["answer","strike"].includes(it.phases[R.ph]))?`<button class="tipbtn" data-act="hint" aria-pressed="${R.hintOn}" title="Tip">💡 ${R.hintOn?"Tip verbergen":"Tip"}</button>`:"";
  let tipBox="";
  const inRoutine=TQ&&it.phases&&!["answer","strike"].includes(it.phases[R.ph]);
  if(R.hintOn&&!A&&!inRoutine){const T=TQ?topicOf(it.text):null;tipBox=`<div class="leotip"><span class="bulb" aria-hidden="true">💡</span><div>${it.hint}${T?`<br><span class="muted">Weet je het echt niet? Denk aan je zin: dit gaat over <b>${esc(T.short)}</b>.</span>`:""}</div></div>`}
  const top=`<div class="qtop"><button class="xbtn" data-act="quit" aria-label="Stoppen">✕</button><div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><b style="width:${pct}%"></b></div>${R.combo>=2?`<span class="combo">🔥 ${R.combo}</span>`:""}<span class="qcount">${it.k==="strat"?"Bonus":it.isRetry?"Herkansing":`${pos+1}/${firstCount}`}</span></div>`;
  const head=`<div class="qhead">${it.isRetry?`<span class="retry-tag">↻ Probeer deze nog eens</span>`:"<span></span>"}${tipBtn}</div>`;
  const sheet=A?fbView(it):"";
  if(TQ)return `<main class="wrap wide qfirst ${A?"has-sheet":""}">${top}<div class="techgrid"><div class="tcol">${body.text}</div><div class="qcol">${head}${tipBox}${body.q}</div></div></main>${sheet}`;
  return `<main class="wrap ${A?"has-sheet":""}">${top}${head}${tipBox}${body}</main>${sheet}`;
}
function fbView(it){
  const R=V.round, A=R.answered, o=A.opt||it.opts[A.idx], right=it.opts.find(x=>x.ok)||{label:""};
  const trapKey=A.ok?null:(o.trap||it.trapOnWrong);
  const last=R.i>=R.items.length-1&&!R.retry.length;
  const btn=`<button class="btn" id="nextbtn" data-act="next">${last?"Bekijk je score":"Volgende vraag ▶"}</button>`;
  if(A.ok){
    const title=it.isRetry?"Nu wel goed!":(R.combo>=3?`${gt("combo")} x${R.combo}!`:gt("praise")[(R.i+R.res.length)%gt("praise").length]);
    return `<div class="sheet ok" role="status"><div class="sheet-in"><span class="shicon ok" aria-hidden="true">✓</span>
      <div class="sh-txt"><h3>${title} <span class="xp">+${it.k==="strat"?15:it.isRetry?5:10} XP</span></h3><p>${it.okWhy}</p>${it.k==="w"&&it.note?`<p class="small">${esc(it.note)}</p>`:""}</div>${btn}</div></div>`;
  }
  const rightLabel=(it.rightText||right.html||esc(right.label)).replace(/\.$/,"");
  const more=`${it.okWhy?`<p>${it.okWhy}</p>`:""}${trapKey&&TRAPS[trapKey]?`<p><b>${TRAPS[trapKey].n}.</b> ${TRAPS[trapKey].tip}</p>`:""}${it.k==="w"&&it.note?`<p>${esc(it.note)}</p>`:""}`;
  return `<div class="sheet no" role="status"><div class="sheet-in"><span class="shicon no" aria-hidden="true">↺</span>
    <div class="sh-txt"><h3>${gt("miss")[R.i%3]}</h3><p>${o.why||"Dit antwoord past niet bij de tekst."}</p><p><b>Goed is:</b> ${rightLabel}</p>
    ${more?`<details class="more"><summary>Meer uitleg</summary>${more}</details>`:""}</div>${btn}</div></div>`;
}
function resultView(){
  const R=V.round, {score,max}=R.done, g=G(), L=lvInfo(g.xp);
  const r=max?score/max:0;
  const msg=r===1?gt("flawless"):r>=.8?gt("strong"):r>=.6?gt("ok"):gt("hard");
  const nextStep={"b-rij":"b-w","b-w":"b-vind","b-vind":"rij",rij:"sw1",sw1:"kies",kies:"vind2",vind:"vind2",vind2:"sw2",sw2:"sw3",sw3:"sw4"}[R.mode];
  const nextT=R.mode.startsWith("t:")?(()=>{const arr=TEXTS[S.lang];const i=arr.findIndex(t=>"t:"+t.id===R.mode);return arr[i+1]?"t:"+arr[i+1].id:null})():null;
  const go=r>=.8&&(nextStep||nextT);
  const again=R.mode!=="fouten";
  return `<main class="wrap"><div class="panel result">
   <div class="res-leo">${leo(r>=.8?"cheer":"happy",96)}</div>
   <h2>${msg}</h2>
   <div class="score">${score} ${gt("of")} ${max}</div>${starStr(score,max)}
   <div class="xpgain">+${R.xp} XP</div>
   ${R.levelUp?`<div class="levelup">🎉 ${gt("rankup")} ${gt("youAre")} <b>${L.name}</b></div>`:""}${R.unlocked?`<div class="unlock">🔓 ${R.unlocked} ${gt("unlocked")}</div>`:""}
   <div class="reslv"><span>${gt("rank")}: <b>${L.name}</b></span><span class="lvbar big"><b style="width:${L.pct}%"></b></span><span class="muted">${gt("xpTo")(L.left,L.next)}</span></div>
   ${badgeRow(R.newBadges||[])}
   <div class="row">
     ${go?`<button class="btn" data-act="startnext" data-v="${nextStep||nextT}">${nextStep?gt("next"):gt("nextText")}</button>`:(again?`<button class="btn" data-act="again">${gt("replay")}</button>`:"")}
     ${go&&again?`<button class="btn soft" data-act="again">${gt("replay")}</button>`:""}
     <button class="btn ghost" data-act="quit">${gt("back")}</button>
   </div>
   <p class="pause muted">${gt("pause")}</p>
  </div></main>`;
}

/* ============================================================
   KLIKKEN EN TOETSEN
   ============================================================ */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled)return;
  const a=b.dataset.act, v=b.dataset.v;
  switch(a){
    case "lang": S.lang=v; if(!S.seenTips[v]){V.tab="tips";S.seenTips[v]=1}else V.tab="sw"; V.tipSec=0;V.tipIdx=0; save(); render(); window.scrollTo(0,0); break;
    case "home": S.lang=null; V.round=null; save(); render(); break;
    case "size": S.size=S.size===1?0:1; save(); render(); break;
    case "tab": V.tab=v; render(); window.scrollTo(0,0); break;
    case "tipsec": V.tipSec=+v; V.tipIdx=0; render(); break;
    case "tipnext": V.tipIdx++; render(); break;
    case "tipprev": V.tipIdx=Math.max(0,V.tipIdx-1); render(); break;
    case "tipall": V.tipAll=!V.tipAll; render(); break;
    case "start": startRound(v); break;
    case "startnext": V.round=null; startRound(v); break;
    case "again": {const m=V.round.mode; V.round=null; startRound(m); break}
    case "ans": answer(+v); break;
    case "next": next(); break;
    case "hint": V.round.hintOn=!V.round.hintOn; V.round.autoTip=false; render(); break;
    case "swtoggle": V.round.swOn=!V.round.swOn; render(); break;
    case "tech": techStart(v); break;
    case "intro": V.intro=true; render(); break;
    case "introClose": if(e.target.closest("[data-stop]")&&!e.target.closest(".introx"))break; V.intro=false; render(); break;
    case "introTips": V.intro=false; V.tab="tips"; render(); window.scrollTo(0,0); break;
    case "introPlay": V.intro=false; V.tab="sw"; render(); window.scrollTo(0,0); break;
    case "pkader": {const R=V.round,it=R.items[R.i],p=paraOf(it.text,it.q);if(+v===p){R.xp+=3;addXP(3);save();phaseDone(`✓ Stap ${R.ph+1} klaar: het antwoord staat in alinea ${p+1}`)}else{const pp=P();pp.traps.alinea=(pp.traps.alinea||0)+1;save();R.sub={pick:+v};render()}break}
    case "psub": phaseDone(null); break;
    case "pkern": {const R=V.round,it=R.items[R.i],t=it.text,p=paraOf(t,it.q),ki=kernOfPara(t,p);R.kernDone.add(p);if(+v===ki){R.xp+=3;addXP(3);save();phaseDone(`✓ Stap ${R.ph+1} klaar: kernzin gevonden en onderstreept`)}else{const pp=P();pp.traps.kernzin=(pp.traps.kernzin||0)+1;save();R.sub={pick:+v};render()}break}
    case "ptok": {const R=V.round;if(R.sub)break;R.markSel.has(v)?R.markSel.delete(v):R.markSel.add(v);render();break}
    case "pmark": {const R=V.round,it=R.items[R.i],t=it.text,p=paraOf(t,it.q),pp=P();
      const targets=targetsOf(t).filter(x=>(t.s[x.si].p||0)===p), tids=new Set(targets.map(x=>x.id)), sig=sigSet(S.lang);
      const inP=[...R.markSel].filter(id=>(t.s[+id.split("-")[0]].p||0)===p);
      const fp=inP.filter(id=>!tids.has(id)).map(id=>{const [si,ti]=id.split("-").map(Number);return tokenize(t.s[si].t)[ti].text}).filter(w=>!sig.has(clean(w)));
      const found=targets.filter(x=>R.markSel.has(x.id)).length;
      targets.forEach(x=>{if(!x.rel)return;pp.rel[x.rel]=pp.rel[x.rel]||{ok:0,bad:0};R.markSel.has(x.id)?pp.rel[x.rel].ok++:pp.rel[x.rel].bad++});
      if(targets.length>found)pp.traps["sw-gemist"]=(pp.traps["sw-gemist"]||0)+(targets.length-found);
      G().found+=found; R.markedP.add(p); const x=2*found; R.xp+=x; if(addXP(x))R.levelUp=true; save();
      if(found===targets.length&&!fp.length){phaseDone(`✓ Stap ${R.ph+1} klaar: alle signaalwoorden gevonden (${found} van ${targets.length}) <span class="xp">+${x} XP</span>`)}else{R.sub={targets,fp,found,xp:x,all:false};render()}
      break}
    case "pstrike": {const R=V.round,it=R.items[R.i],j=+v,n=Object.values(R.strike).filter(Boolean).length;if(R.strike[j])R.strike[j]=false;else if(n<it.opts.length-1)R.strike[j]=true;render();break}
    case "pstrikego": {const R=V.round,it=R.items[R.i];const left=it.opts.findIndex((_,j)=>!R.strike[j]);if(left>=0)answer(left);break}
    case "ptopic": {const R=V.round;const T=topicOf(R.textRef);R.topicPick=+v;if(T.o[+v].ok){R.xp+=5;if(addXP(5))R.levelUp=true}else{const p=P();p.traps.techniek=(p.traps.techniek||0)+1}save();render();break}
    case "pnext": {const R=V.round;R.markPhase=false;prepItem();render();window.scrollTo(0,0);break}
    case "mtok": {const M=V.round.mark; if(M.res)break; M.sel.has(v)?M.sel.delete(v):M.sel.add(v); render(); break}
    case "mcheck": {const R=V.round; R.mark.res=markCheck(R.textRef,R.mark.sel); const x=R.mark.res.found*2; R.xp+=x; if(addXP(x))R.levelUp=true; save(); render(); const nb=$("#nextbtn"); if(nb)nb.focus({preventScroll:true}); break}
    case "mgo": {const R=V.round; R.markPhase=false; R.hl=true; autoTip(); render(); window.scrollTo(0,0); break}
    case "hunt": {const all=TEXTS[S.lang];const last=V.tech&&V.tech.t.id;let pool=all.filter(t=>t.id!==last);const tt=pick(pool.length?pool:all);V.tech=null;techStart(tt.id,["circle"]);break}
    case "kchip": {const R=V.round;const j=+v;R.multi.has(j)?R.multi.delete(j):(R.multi.size<3&&R.multi.add(j));render();break}
    case "kcheck": {const R=V.round,it=R.items[R.i];const wrong=[...R.multi].map(j=>it.chips[j]).filter(c=>c.rel!==it.rel);const ok=wrong.length===0;
      settle(it,ok,{label:[...R.multi].map(j=>it.chips[j].w).join(", "),why:ok?"":wrong.map(c=>`‘${esc(c.w)}’ hoort bij ${REL[c.rel].n}.`).join(" ")});break}
    case "vtok": {const R=V.round,it=R.items[R.i];const ti=+v;R.vpick=ti;
      if(ti===it.ti){ if(it.both){R.phase=2;render();} else settle(it,true,{label:it.word,ok:true}); }
      else settle(it,false,{label:it.toks[ti].text,trap:"sw-gemist",why:`‘${esc(it.toks[ti].text)}’ is geen signaalwoord. Het signaalwoord is ‘${esc(it.word)}’: dat woord koppelt de twee stukken aan elkaar.`});
      break}
    case "techq": V.tech=null; startRound("t:"+v,true); break;
    case "ttopic": {const X=V.tech;X.topicPick=+v;X.ok.topic=!!X.t.tech.topic[+v].ok;render();break}
    case "tok": {const X=V.tech;X.sel.has(v)?X.sel.delete(v):X.sel.add(v);render();break}
    case "tone2": {const X=V.tech;const p0=X.toneI||0;X.tone[p0]=v;X.toneAns=true;if(v!==X.t.tech.tone[p0])techRecordTrap("toon");
      if(p0===X.t.np-1){X.toneRes=X.t.tech.tone.map((x,i)=>X.tone[i]===x);X.ok.tone=X.toneRes.every(Boolean)}render();break}
    case "tnextp": {const X=V.tech;X.toneI=(X.toneI||0)+1;X.toneAns=false;render();break}
    case "tcheck": techCheck(); break;
    case "tnext": {const X=V.tech; if(X.steps[X.step].k==="kader")X.ok.kader=X.kOk!==false; techNext(); break}
    case "para": {const X=V.tech;const q=X.t.q[X.t.tech.kader[X.kI]];X.kPara=+v;if(+v!==q.p){X.kOk=false;techRecordTrap("alinea")}render();break}
    case "kans": {const X=V.tech;const qi=X.t.tech.kader[X.kI];const q=X.t.q[qi];X.kAns=+v;const ok=(+v===1)===q.ans;if(!ok)X.kOk=false;
      const it=mkTQ(X.t,qi);record(it,ok,it.opts[+v===1?0:1]);X.acc[q.p]=(X.acc[q.p]||[]).concat(`Bewering ${X.kI+1} = ${q.ans?"juist":"onjuist"}`);render();break}
    case "knext": {const X=V.tech;X.kI++;X.kPara=null;X.kAns=null;render();window.scrollTo(0,0);break}
    case "strike": {const X=V.tech;const oi=+v;const n=Object.values(X.strike).filter(Boolean).length;const max=X.t.q[X.t.tech.strike].o.length-1;if(X.strike[oi])X.strike[oi]=false;else if(n<max)X.strike[oi]=true;render();break}
    case "quit": {if(V.tech){V.tech=null;V.tab="tech";render();window.scrollTo(0,0);break}
      const m=V.round&&V.round.mode; V.round=null; V.tab=m&&m.startsWith("t:")?"tx":(m==="fouten"?"fout":"sw"); render(); window.scrollTo(0,0); break}
    case "reset": if(confirm(`Weet je het zeker? Je scores voor ${LANGS[S.lang].n} worden gewist.`)){delete S.p[S.lang]; save(); render()} break;
  }
});
document.addEventListener("keydown",e=>{
  if(V.intro&&e.key==="Escape"){V.intro=false;render();return}
  const el=e.target; if((e.key==="Enter"||e.key===" ")&&el&&el.getAttribute&&el.getAttribute("role")==="button"&&el.dataset.act){e.preventDefault();el.click();return}
  const R=V.round; if(!R||R.done||R.markPhase||e.metaKey||e.ctrlKey||e.altKey)return;
  if(!R.answered){const n=parseInt(e.key,10); const it=R.items[R.i]; if(n>=1&&n<=it.opts.length&&!(it.k==="tq"&&(it.q.type==="kern"||(it.phases&&it.phases[R.ph]!=="answer")))&&it.k!=="kies"&&!(it.k==="vind"&&(R.phase||1)===1)){e.preventDefault();answer(n-1)}}
  else if(e.key==="Enter"&&document.activeElement&&document.activeElement.id!=="nextbtn"){e.preventDefault();next()}
});
applyHiddenTexts();
render();
</script>
